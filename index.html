<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Assistant</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
    
    header { background-color: #1e293b; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    header h1 { font-size: 1.15rem; color: #38bdf8; font-weight: 600; }
    
    #clear-btn {
      background-color: #334155;
      color: #cbd5e1;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid #475569;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    #clear-btn:hover {
      background-color: #dc2626;
      color: #ffffff;
      border-color: #ef4444;
    }

    #chat-container { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
    .message { max-width: 80%; padding: 12px 18px; border-radius: 10px; line-height: 1.5; font-size: 0.95rem; }
    .user { align-self: flex-end; background-color: #2563eb; color: #ffffff; border-bottom-right-radius: 2px; }
    .bot { align-self: flex-start; background-color: #1e293b; color: #e2e8f0; border-bottom-left-radius: 2px; border: 1px solid #334155; }
    
    .bot table { border-collapse: collapse; margin: 10px 0; width: 100%; font-size: 0.88rem; }
    .bot th, .bot td { border: 1px solid #475569; padding: 8px 12px; text-align: left; }
    .bot th { background-color: #334155; }
    .bot ul, .bot ol { margin-left: 20px; margin-top: 6px; margin-bottom: 6px; }

    footer { background-color: #1e293b; padding: 16px 24px; border-top: 1px solid #334155; }
    form { display: flex; gap: 12px; }
    input[type="text"] { flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid #475569; background-color: #0f172a; color: #fff; outline: none; }
    input[type="text"]:focus { border-color: #38bdf8; }
    #send-btn { background-color: #0284c7; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    #send-btn:disabled { background-color: #475569; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <h1>AI Assistant</h1>
    <button id="clear-btn" type="button">Clear Chat</button>
  </header>

  <div id="chat-container">
    <div class="message bot">Hello! I am your AI Assistant. How can I help you today?</div>
  </div>

  <footer>
    <form id="chat-form">
      <input type="text" id="user-input" placeholder="Ask a question..." autocomplete="off" />
      <button type="submit" id="send-btn">Send</button>
    </form>
  </footer>

  <script>
    const form = document.getElementById("chat-form");
    const input = document.getElementById("user-input");
    const container = document.getElementById("chat-container");
    const sendBtn = document.getElementById("send-btn");
    const clearBtn = document.getElementById("clear-btn");
    const SESSION_ID = "user_session";

    // Load history on startup
    window.addEventListener("DOMContentLoaded", async () => {
      try {
        const res = await fetch(`/api/history/${SESSION_ID}`);
        if (res.ok) {
          const data = await res.json();
          const history = data.history;
          
          if (history && history.length > 1) {
            container.innerHTML = ""; // Clear default greeting
            history.forEach(msg => {
              if (msg.role !== "system") {
                appendMessage(msg.content, msg.role, true);
              }
            });
          }
        }
      } catch (err) {
        console.error("Failed to load history:", err);
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      appendMessage(message, "user");
      input.value = "";
      sendBtn.disabled = true;

      const botMessageEl = appendMessage("", "bot");
      let fullResponse = "";

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: message, session_id: SESSION_ID })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value, { stream: true });
          fullResponse += chunk;
          botMessageEl.innerHTML = marked.parse(fullResponse);
          container.scrollTop = container.scrollHeight;
        }
      } catch (err) {
        botMessageEl.innerText = "Error: Failed to fetch response from server.";
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });

    clearBtn.addEventListener("click", async () => {
      try {
        await fetch("/api/clear", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: SESSION_ID })
        });
        container.innerHTML = `
          <div class="message bot">Hello! I am your AI Assistant. How can I help you today?</div>
        `;
      } catch (err) {
        console.error("Failed to clear chat session:", err);
      }
    });

    function appendMessage(text, role, isHistory = false) {
      const el = document.createElement("div");
      el.className = `message ${role}`;
      if (isHistory) {
        el.innerHTML = marked.parse(text);
      } else {
        el.innerHTML = text ? marked.parse(text) : '<span style="opacity: 0.5;">Thinking...</span>';
      }
      container.appendChild(el);
      container.scrollTop = container.scrollHeight;
      return el;
    }
  </script>
</body>
</html>
